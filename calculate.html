<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3-Phase Motor & Load Calculator</title>
  <link rel="stylesheet" href="calculate.css" />
</head>
<body>
  <!-- Existing motor input UI here -->
  
  <section class="calculator-section">
    <h2>3-Phase Star-Connected Load Calculator</h2>
    <div class="form-group">
      <label for="resistance">Resistance (Ω):</label>
      <input type="number" id="resistance" value="50" />
    </div>
    <div class="form-group">
      <label for="reactance">Reactance (Ω):</label>
      <input type="number" id="reactance" value="30" />
    </div>
    <div class="form-group">
      <label for="lineVoltage">Line Voltage (V):</label>
      <input type="number" id="lineVoltage" value="440" />
    </div>
    <button onclick="calculatePower()">Calculate</button>

    <div id="result"></div>
  </section>

  <script src="calculate.js"></script>
</body>
</html>
