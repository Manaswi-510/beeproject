<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3-Phase Motor Simulation</title>
  <link rel="stylesheet" href="wave.css" />
</head>
<body>
  <div class="controls">
    <label>Frequency (Hz): <input type="number" id="freq" value="50" /></label>
    <label>Slip %: <input type="number" id="slip" value="2" /></label>
    <label>No. of Poles: <input type="number" id="poles" value="4" /></label>
    <button onclick="startSimulation()">Start</button>
    <button onclick="stopSimulation()">Stop</button>
  </div>

  <div class="canvas-container">
    <canvas id="waveCanvas" width="600" height="300"></canvas>
    <canvas id="rotorCanvas" width="300" height="300"></canvas>
  </div>
  <a href="calculate.html">load calculator</a>

  <script src="wave.js"></script>
</body>
</html>
